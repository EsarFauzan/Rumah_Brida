<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rumah Brida</title>
    <style>
      :root {
        --brand: #0f766e;
        --brand-dark: #115e59;
        --ink: #16201d;
        --muted: #5c6b66;
        --line: #d8e2de;
        --surface: #ffffff;
        --page: #f5f8f7;
        --accent: #f59e0b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
        background: var(--page);
      }

      .navbar {
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }

      .nav-inner {
        display: flex;
        min-height: 72px;
        max-width: 1180px;
        margin: 0 auto;
        padding: 0 24px;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        color: var(--ink);
        text-decoration: none;
        white-space: nowrap;
      }

      .brand-logo {
        width: 44px;
        height: 52px;
        object-fit: contain;
        flex: 0 0 auto;
      }

      .brand-text {
        display: grid;
        gap: 2px;
      }

      .brand-title {
        font-size: 18px;
        font-weight: 700;
        line-height: 1.1;
      }

      .brand-subtitle {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.2;
      }

      .nav-toggle {
        display: none;
      }

      .nav-toggle-label {
        display: none;
        width: 42px;
        height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .nav-toggle-label span,
      .nav-toggle-label span::before,
      .nav-toggle-label span::after {
        display: block;
        width: 20px;
        height: 2px;
        border-radius: 999px;
        background: var(--ink);
        content: "";
        transition: 0.2s ease;
      }

      .nav-toggle-label span {
        position: relative;
      }

      .nav-toggle-label span::before {
        position: absolute;
        top: -7px;
      }

      .nav-toggle-label span::after {
        position: absolute;
        top: 7px;
      }

      .nav-menu {
        display: flex;
        margin: 0;
        padding: 0;
        align-items: center;
        gap: 6px;
        list-style: none;
      }

      .nav-item {
        position: relative;
      }

      .nav-link,
      .submenu-button {
        display: inline-flex;
        min-height: 42px;
        padding: 0 14px;
        border: 0;
        border-radius: 8px;
        align-items: center;
        gap: 7px;
        color: var(--ink);
        background: transparent;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }

      .nav-link:hover,
      .submenu-button:hover {
        background: #e9f3f1;
        color: var(--brand-dark);
      }

      .nav-link.active {
        background: var(--brand);
        color: white;
      }

      .chevron {
        width: 8px;
        height: 8px;
        border-right: 2px solid currentColor;
        border-bottom: 2px solid currentColor;
        transform: rotate(45deg) translateY(-2px);
      }

      .submenu {
        position: absolute;
        top: calc(100% + 10px);
        left: 0;
        display: grid;
        min-width: 210px;
        margin: 0;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        box-shadow: 0 18px 40px rgba(22, 32, 29, 0.12);
        list-style: none;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-6px);
        transition: 0.16s ease;
      }

      .nav-item:hover .submenu,
      .nav-item:focus-within .submenu {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      .submenu a {
        display: block;
        padding: 11px 12px;
        border-radius: 7px;
        color: var(--ink);
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }

      .submenu a:hover {
        background: #f3f7f6;
        color: var(--brand-dark);
      }

      .report-link {
        background: var(--accent);
        color: #271a00;
      }

      .report-link:hover {
        background: #d97706;
        color: white;
      }

      .hero {
        max-width: 1180px;
        margin: 0 auto;
        padding: 86px 24px;
      }

      .hero h1 {
        max-width: 680px;
        margin: 0 0 16px;
        font-size: clamp(36px, 6vw, 64px);
        line-height: 1;
      }

      .hero p {
        max-width: 620px;
        margin: 0;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.7;
      }

      @media (max-width: 820px) {
        .nav-inner {
          min-height: 64px;
          padding: 0 16px;
        }

        .brand-subtitle {
          display: none;
        }

        .brand-logo {
          width: 36px;
          height: 42px;
        }

        .nav-toggle-label {
          display: inline-flex;
        }

        .nav-menu {
          position: absolute;
          top: 100%;
          right: 0;
          left: 0;
          display: none;
          padding: 10px 16px 16px;
          border-bottom: 1px solid var(--line);
          background: white;
          align-items: stretch;
          gap: 4px;
        }

        .nav-toggle:checked ~ .nav-menu {
          display: grid;
        }

        .nav-toggle:checked + .nav-toggle-label span {
          background: transparent;
        }

        .nav-toggle:checked + .nav-toggle-label span::before {
          top: 0;
          transform: rotate(45deg);
        }

        .nav-toggle:checked + .nav-toggle-label span::after {
          top: 0;
          transform: rotate(-45deg);
        }

        .nav-link,
        .submenu-button {
          width: 100%;
          justify-content: space-between;
          padding: 0 12px;
        }

        .submenu {
          position: static;
          display: grid;
          min-width: 0;
          margin: 2px 0 8px;
          padding: 4px;
          border: 0;
          box-shadow: none;
          opacity: 1;
          visibility: visible;
          transform: none;
          background: #f3f7f6;
        }

        .submenu a {
          padding: 10px 12px;
        }

        .hero {
          padding: 56px 16px;
        }
      }
    </style>
  </head>
  <body>
    <header class="navbar">
      <nav class="nav-inner" aria-label="Navigasi utama">
        <a class="brand" href="#">
          <img
            class="brand-logo"
            src="assets/logo-sulteng.png"
            alt="Logo Sulawesi Tengah"
          />
          <span class="brand-text">
            <span class="brand-title">Rumah Brida</span>
            <span class="brand-subtitle">Badan Riset dan Inovasi Daerah</span>
          </span>
        </a>

        <input class="nav-toggle" type="checkbox" id="nav-toggle" aria-label="Buka menu" />
        <label class="nav-toggle-label" for="nav-toggle" aria-hidden="true">
          <span></span>
        </label>

        <ul class="nav-menu">
          <li class="nav-item">
            <a class="nav-link active" href="#">Beranda</a>
          </li>
          <li class="nav-item">
            <button class="submenu-button" type="button">
              Riset
              <span class="chevron" aria-hidden="true"></span>
            </button>
            <ul class="submenu" aria-label="Submenu Riset">
              <li><a href="#">Submenu riset menyusul</a></li>
            </ul>
          </li>
          <li class="nav-item">
            <button class="submenu-button" type="button">
              Inovasi
              <span class="chevron" aria-hidden="true"></span>
            </button>
            <ul class="submenu" aria-label="Submenu Inovasi">
              <li><a href="#">Submenu inovasi menyusul</a></li>
            </ul>
          </li>
          <li class="nav-item">
            <button class="submenu-button" type="button">
              Lomba
              <span class="chevron" aria-hidden="true"></span>
            </button>
            <ul class="submenu" aria-label="Submenu Lomba">
              <li><a href="#">Submenu lomba menyusul</a></li>
            </ul>
          </li>
          <li class="nav-item">
            <a class="nav-link report-link" href="#">Lapor</a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="hero">
      <h1>Rumah Brida</h1>
      <p>
        Portal informasi riset, inovasi, lomba, dan layanan pelaporan Badan
        Riset dan Inovasi Daerah.
      </p>
    </main>
  </body>
</html>
